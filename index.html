<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truestory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #1a1e0a;
            color: #e8ff00;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        :root {
            --y: #e8ff00;
            --dim: rgba(232,255,0,0.3);
            --faint: rgba(232,255,0,0.1);
        }

        .wrap {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 2.5vh 3vw 1.5vh;
        }

        /* ── TOP ── */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1vh;
        }
        .top-left h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.4rem, 3.5vw, 2.8rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .billing {
            margin-top: 0.6vh;
            font-size: clamp(0.38rem, 0.55vw, 0.48rem);
            color: var(--dim);
            line-height: 1.7;
        }
        .lang {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            padding-top: 0.3rem;
        }
        .lang button {
            background: none;
            border: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.42rem, 0.7vw, 0.55rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--dim);
            cursor: pointer;
            transition: color 0.2s;
        }
        .lang button.active { color: var(--y); }
        .lang button:hover { color: var(--y); }
        .lang span { font-size: 0.4rem; color: var(--faint); }

        .line { height: 1px; background: var(--faint); flex-shrink: 0; }

        /* ── MID: FOUNDERS ── */
        .mid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3vw;
            min-height: 0;
            overflow: hidden;
            padding-top: 1.5vh;
        }
        .col {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .col-name {
            font-family: 'Syne', sans-serif;
            font-size: clamp(0.9rem, 2vw, 1.5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            line-height: 1;
            margin-bottom: 0.15em;
        }
        .col-role {
            font-size: clamp(0.38rem, 0.6vw, 0.48rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--dim);
            margin-bottom: 1vh;
        }
        .credits {
            display: flex;
            flex-direction: column;
            gap: 0;
            min-height: 0;
        }
        .cr {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.5rem;
            padding: 0.35vh 0;
            border-bottom: 1px solid var(--faint);
        }
        .cr:first-child { border-top: 1px solid var(--faint); }
        .cr-t {
            font-size: clamp(0.48rem, 0.85vw, 0.7rem);
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cr-m {
            font-size: clamp(0.36rem, 0.55vw, 0.48rem);
            color: var(--dim);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .note {
            font-size: clamp(0.38rem, 0.55vw, 0.48rem);
            font-style: italic;
            color: var(--dim);
            padding-top: 0.4vh;
            line-height: 1.5;
        }
        .note a {
            color: var(--y);
            text-decoration: none;
            transition: color 0.2s;
        }
        .note a:hover { color: #fff; }

        .foot {
            font-size: clamp(0.32rem, 0.42vw, 0.4rem);
            color: var(--faint);
            letter-spacing: 0.06em;
            text-align: right;
            padding-top: 1vh;
        }

        /* ── MOBILE ── */
        @media (max-width: 700px) {
            .wrap { padding: 1.5vh 4vw 1vh; }
            .cr-m { display: none; }
            .billing { font-size: 0.38rem; }
        }

        @media (max-width: 480px) {
            .wrap { padding: 1.2vh 3.5vw 0.8vh; }
            .top-left h1 { font-size: 1.2rem; }
            .col-name { font-size: 0.8rem; }
            .col-role { font-size: 0.36rem; margin-bottom: 0.5vh; }
            .cr-t { font-size: 0.44rem; }
            .cr { padding: 0.2vh 0; }
            .note { font-size: 0.36rem; }
            .billing { font-size: 0.34rem; }
        }

        @media (max-height: 500px) {
            .wrap { padding: 0.8vh 3vw 0.5vh; }
            .cr { padding: 0.1vh 0; }
            .note { padding-top: 0.2vh; }
        }
    </style>
</head>
<body>

<div class="wrap">

    <div class="top">
        <div class="top-left">
            <h1>Truestory</h1>
            <div class="billing">
                <span>Truestory, s.r.o. · Račianska 18, 831 02 Bratislava</span><br>
                <span>IČO 47603607 · DIČ 2024011011 · </span><span data-sk="OR MS Bratislava III, oddiel Sro, vložka 95630/B" data-en="Commercial Register Bratislava III, Sec. Sro, File 95630/B"></span>
            </div>
        </div>
        <div class="lang">
            <button class="active" onclick="L('sk')">SK</button>
            <span>/</span>
            <button onclick="L('en')">EN</button>
        </div>
    </div>

    <div class="line"></div>

    <div class="mid">
        <div class="col">
            <div class="col-name">Miro Šifra</div>
            <div class="col-role" data-sk="Producent · Scenárista" data-en="Producer · Screenwriter"></div>
            <div class="credits">
                <div class="cr"><span class="cr-t" data-orig="Zmizení Sáry Lindertové" data-en="The Disappearance of Sara Lindert"></span><span class="cr-m" data-sk="Seriál · CANAL+ · TV JOJ · ČT · 2027" data-en="Series · CANAL+ · TV JOJ · ČT · 2027"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Studna" data-en="The Well"></span><span class="cr-m" data-sk="Seriál · Oneplay · 2025" data-en="Series · Oneplay · 2025"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Černák" data-en="Černák"></span><span class="cr-m" data-sk="Film · 2025" data-en="Film · 2025"></span></div>
                <div class="cr"><span class="cr-t" data-orig="MIKI" data-en="MIKI"></span><span class="cr-m" data-sk="Film · 2024" data-en="Film · 2024"></span></div>
                <div class="cr"><span class="cr-t" data-orig="To se vysvětlí, soudruzi!" data-en="We Are on It, Comrades"></span><span class="cr-m" data-sk="Seriál · ČT · 2024" data-en="Series · ČT · 2024"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Úsvit" data-en="We Have Never Been Modern"></span><span class="cr-m" data-sk="Film · 2023" data-en="Film · 2023"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Zrádci" data-en="Rats"></span><span class="cr-m" data-sk="Miniséria · 2020" data-en="Miniseries · 2020"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Rédl" data-en="Red Line"></span><span class="cr-m" data-sk="Miniséria · ČT · 2018" data-en="Miniseries · ČT · 2018"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Červený kapitán" data-en="The Red Captain"></span><span class="cr-m" data-sk="Film · 2016" data-en="Film · 2016"></span></div>
            </div>
        </div>
        <div class="col">
            <div class="col-name">Lukáš Kodoň</div>
            <div class="col-role" data-sk="Producent · Režisér" data-en="Producer · Director"></div>
            <div class="credits">
                <div class="cr"><span class="cr-t" data-orig="Zmizení Sáry Lindertové" data-en="The Disappearance of Sara Lindert"></span><span class="cr-m" data-sk="Seriál · CANAL+ · TV JOJ · ČT · 2027" data-en="Series · CANAL+ · TV JOJ · ČT · 2027"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Farma Česko" data-en="The Farm Czech Republic"></span><span class="cr-m" data-sk="Reality · TV Nova · 2026" data-en="Reality · TV Nova · 2026"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Jáma lvová" data-en="Lions' Den"></span><span class="cr-m" data-sk="Reality · TV Nova · TV Markíza · 2025" data-en="Reality · TV Nova · TV Markíza · 2025"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Farma SK" data-en="The Farm SK"></span><span class="cr-m" data-sk="Reality · TV Markíza · 12 sérií" data-en="Reality · TV Markíza · 12 seasons"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Nové bývanie" data-en="New Living"></span><span class="cr-m" data-sk="Reality · TV JOJ" data-en="Reality · TV JOJ"></span></div>
                <div class="cr"><span class="cr-t" data-orig="Utajený šéf" data-en="Undercover Boss"></span><span class="cr-m" data-sk="Reality · TV" data-en="Reality · TV"></span></div>
            </div>
            <div class="note" data-sk="+ množstvo divadelných a live performance projektov" data-en="+ a lot of theatre and live performance works"></div>
            <div class="note" data-sk="+ veľa nových projektov v príprave" data-en="+ a lot of new projects in development"></div>
            <div class="note" id="cta"></div>
        </div>
    </div>

    <div class="foot">&copy; 2026 Truestory, s.r.o.</div>

</div>

<script>
function L(l){
    document.documentElement.lang=l;
    document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.textContent.trim()===(l==='sk'?'SK':'EN')));
    document.querySelectorAll('[data-sk][data-en]').forEach(e=>e.textContent=e.getAttribute('data-'+l));
    document.querySelectorAll('.cr-t[data-orig]').forEach(e=>{
        e.textContent = l==='sk' ? e.getAttribute('data-orig') : e.getAttribute('data-en');
    });
    document.querySelectorAll('.cr-m[data-sk]').forEach(e=>e.textContent=e.getAttribute('data-'+l));
    const cta=document.getElementById('cta');
    if(l==='sk') cta.innerHTML='+ ak máte niečo zaujímavé, <a href="mailto:miro@sifra.sk">ozvite sa nám</a>';
    else cta.innerHTML='+ if you have something interesting, <a href="mailto:miro@sifra.sk">get in touch</a>';
}
L('sk');
</script>

</body>
</html>
