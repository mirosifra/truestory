<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truestory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #111408;
            color: #f0ff2b;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --y: #f0ff2b;
            --dim: rgba(240,255,43,0.55);
            --faint: rgba(240,255,43,0.15);
        }

        /* ═══ DESKTOP: one viewport ═══ */
        .wrap {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3vh 4vw 2vh;
        }

        /* ── TOP ── */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2vh;
        }
        .top h1 {
            font-family: 'Bungee', cursive;
            font-size: 4.5vw;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .billing {
            font-size: 0.7vw;
            color: var(--dim);
            line-height: 1.8;
            margin-top: 0.5vh;
        }
        .lang {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            padding-top: 0.5rem;
        }
        .lang button {
            background: none;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.8vw;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--dim);
            cursor: pointer;
            transition: color 0.15s;
        }
        .lang button.active { color: var(--y); }
        .lang button:hover { color: var(--y); }
        .lang span { font-size: 0.6vw; color: var(--faint); }

        .line { height: 1px; background: var(--faint); }

        /* ── FOUNDERS ── */
        .mid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4vw;
            padding: 2vh 0;
            align-content: start;
        }
        .col-name {
            font-family: 'Bungee', cursive;
            font-size: 2vw;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 0.3em;
        }
        .col-role {
            font-size: 0.75vw;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--dim);
            margin-bottom: 1.5vh;
        }
        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4vw;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.3em;
            border: 1px solid var(--dim);
            border-radius: 100px;
            padding: 0.35em 0.9em;
            font-size: 0.85vw;
            white-space: nowrap;
            transition: border-color 0.2s;
        }
        .pill:hover { border-color: var(--y); }
        .pill-yr { font-size: 0.85em; color: var(--dim); }

        .notes {
            margin-top: 1.5vh;
            font-size: 0.75vw;
            font-style: italic;
            color: var(--dim);
            line-height: 1.8;
        }
        .notes a { color: var(--y); text-decoration: none; }
        .notes a:hover { color: #fff; }

        .foot {
            font-size: 0.6vw;
            color: var(--faint);
            letter-spacing: 0.06em;
            padding-top: 1vh;
        }

        /* ═══ MOBILE ═══ */
        @media (max-width: 768px) {
            .wrap {
                min-height: auto;
                padding: 5vw;
                gap: 4vw;
            }
            .top { margin-bottom: 3vw; }
            .top h1 { font-size: 10vw; }
            .billing { font-size: 2.5vw; line-height: 1.7; margin-top: 2vw; }
            .lang button { font-size: 2.8vw; }
            .lang span { font-size: 2vw; }
            .mid {
                grid-template-columns: 1fr;
                gap: 6vw;
                padding: 3vw 0;
            }
            .col-name { font-size: 6vw; }
            .col-role { font-size: 2.8vw; margin-bottom: 2vw; }
            .pills { gap: 1.5vw; }
            .pill { font-size: 3vw; padding: 0.4em 0.9em; }
            .notes { font-size: 2.8vw; margin-top: 3vw; line-height: 1.7; }
            .foot { font-size: 2.2vw; padding-top: 4vw; padding-bottom: 3vw; }
        }

        @media (max-width: 400px) {
            .wrap { padding: 4vw; }
            .top h1 { font-size: 11vw; }
            .billing { font-size: 2.8vw; }
            .col-name { font-size: 7vw; }
            .col-role { font-size: 3vw; }
            .pill { font-size: 3.2vw; }
            .notes { font-size: 3vw; }
        }
    </style>
</head>
<body>

<div class="wrap">

    <div>
        <div class="top">
            <div>
                <h1>Truestory</h1>
                <div class="billing">
                    Truestory, s.r.o. · Račianska 18, 831 02 Bratislava · IČO 47603607 · DIČ 2024011011<br>
                    <span data-sk="OR MS Bratislava III, oddiel Sro, vložka 95630/B" data-en="Commercial Register Bratislava III, Sec. Sro, File 95630/B"></span>
                </div>
            </div>
            <div class="lang">
                <button class="active" onclick="L('sk')">SK</button>
                <span>/</span>
                <button onclick="L('en')">EN</button>
            </div>
        </div>

        <div class="line"></div>
    </div>

    <div class="mid">
        <div>
            <div class="col-name">Miro Šifra</div>
            <div class="col-role" data-sk="Producent · Scenárista" data-en="Producer · Screenwriter"></div>
            <div class="pills" id="pills-miro"></div>
        </div>
        <div>
            <div class="col-name">Lukáš Kodoň</div>
            <div class="col-role" data-sk="Producent · Režisér" data-en="Producer · Director"></div>
            <div class="pills" id="pills-lukas"></div>
            <div class="notes">
                <span data-sk="+ množstvo divadelných a live performance projektov" data-en="+ a lot of theatre and live performance works"></span><br>
                <span data-sk="+ veľa nových projektov v príprave" data-en="+ a lot of new projects in development"></span><br>
                <span id="cta"></span>
            </div>
        </div>
    </div>

    <div>
        <div class="line"></div>
        <div class="foot">&copy; 2026 Truestory, s.r.o.</div>
    </div>

</div>

<script>
const miro=[
    {sk:'Zmizení Sáry Lindertové',en:'The Disappearance of Sara Lindert',y:'2027'},
    {sk:'Studna',en:'The Well',y:'2025'},
    {sk:'Černák',en:'Černák',y:'2025'},
    {sk:'MIKI',en:'MIKI',y:'2024'},
    {sk:'To se vysvětlí, soudruzi!',en:'We Are on It, Comrades',y:'2024'},
    {sk:'Úsvit',en:'We Have Never Been Modern',y:'2023'},
    {sk:'Zrádci',en:'Rats',y:'2020'},
    {sk:'Rédl',en:'Red Line',y:'2018'},
    {sk:'Červený kapitán',en:'The Red Captain',y:'2016'}
];
const lukas=[
    {sk:'Zmizení Sáry Lindertové',en:'The Disappearance of Sara Lindert',y:'2027'},
    {sk:'Farma Česko',en:'The Farm Czech Republic',y:'2026'},
    {sk:'Jáma lvová',en:"Lions' Den",y:'2025'},
    {sk:'Farma SK',en:'The Farm SK',y:'12s'},
    {sk:'Nové bývanie',en:'New Living',y:''},
    {sk:'Utajený šéf',en:'Undercover Boss',y:''}
];

function pills(data,el,l){
    el.innerHTML=data.map(d=>{
        const t=l==='sk'?d.sk:d.en;
        const yr=d.y?'<span class="pill-yr">'+d.y+'</span>':'';
        return '<span class="pill">'+t+' '+yr+'</span>';
    }).join('');
}

function L(l){
    document.documentElement.lang=l;
    document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.textContent.trim()===(l==='sk'?'SK':'EN')));
    document.querySelectorAll('[data-sk][data-en]').forEach(e=>e.textContent=e.getAttribute('data-'+l));
    pills(miro,document.getElementById('pills-miro'),l);
    pills(lukas,document.getElementById('pills-lukas'),l);
    const c=document.getElementById('cta');
    c.innerHTML=l==='sk'
        ?'+ ak máte niečo zaujímavé, <a href="mailto:miro@sifra.sk">ozvite sa nám</a>'
        :'+ if you have something interesting, <a href="mailto:miro@sifra.sk">get in touch</a>';
}
L('sk');
</script>

</body>
</html>
